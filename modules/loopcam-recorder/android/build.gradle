plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.loopcamrecorder'
version = '0.1.0'

android {
  namespace "expo.modules.loopcamrecorder"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

def cameraxVersion = "1.4.2"

dependencies {
  // §4 — CameraX drives capture; camera-video gives us hardware-encoded
  // segments without touching MediaCodec directly.
  implementation "androidx.camera:camera-core:$cameraxVersion"
  implementation "androidx.camera:camera-camera2:$cameraxVersion"
  implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
  implementation "androidx.camera:camera-video:$cameraxVersion"
  implementation "androidx.camera:camera-view:$cameraxVersion"
  // The burned-in timestamp: OverlayEffect composites it on the GPU, into the
  // preview and the encoded stream at once.
  implementation "androidx.camera:camera-effects:$cameraxVersion"

  // §5.1 — LifecycleService, so the foreground service can own the camera binding.
  implementation "androidx.lifecycle:lifecycle-service:2.8.7"

  // §6 — deferred cleanup/battery-safe tasks.
  implementation "androidx.work:work-runtime-ktx:2.10.0"

  // §Part 1 — the Doppler speed on every fix. Deliberately the fused client
  // rather than LocationManager: it is the only one that reliably keeps the
  // GNSS chip in continuous-tracking mode, which is what makes the Doppler
  // solution available on every fix instead of intermittently.
  implementation "com.google.android.gms:play-services-location:21.3.0"

  // The speed validation and formatting rules are pure functions, and they are
  // the one part of phase 5 that can be pinned down without a device.
  testImplementation "junit:junit:4.13.2"
}
